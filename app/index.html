<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Jardín</title>
  <meta name="description" content="Inventario de tus plantas, sus cuidados y avisos según el tiempo." />
  <meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mi Jardín" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>Mi Jardín</h1>
      <button class="place" id="placeBtn" type="button" aria-label="Cambiar ubicación"></button>
    </div>
  </header>

  <main id="main" aria-live="polite"></main>

  <button class="fab" id="fab" type="button" data-action="new-plant" aria-label="Añadir planta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" role="tablist" aria-label="Secciones">
    <button type="button" role="tab" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy
    </button>
    <button type="button" role="tab" data-tab="plants">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-7 8-7 0 5-3 8-8 7z"/><path d="M12 15c0-3-2-5.5-6-5.5 0 4 2 6 6 5.5z"/></svg>Plantas
    </button>
    <button type="button" role="tab" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes
    </button>
  </nav>

  <dialog id="sheet"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
