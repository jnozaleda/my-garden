name = "my-garden-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Workers AI (free daily allocation). Used while PROVIDER = "workers-ai".
[ai]
binding = "AI"

# Per-species answers (90 days) and the daily call counter.
[[kv_namespaces]]
binding = "CACHE"
id = "81322824fdd74edea7300bb086625d7c"

# Daily push at 08:00 Madrid: 06:00 UTC in summer, 07:00 UTC in winter (scheduled() checks the hour).
[triggers]
crons = ["0 6,7 * * *"]

[vars]
VAPID_PUBLIC = "BAgS8ly6V2km_DtMyicFWaAQ9gGQyJdX9OP-oiXx9i9OB98Lr2H5gOkqYP9RUsYPq9333c5NPpKZgLijFUlz3ZE"
ALLOWED_ORIGINS = "https://jnozaleda.github.io,https://florvia.app,https://www.florvia.app,http://localhost:8767"
# Chain: first that answers wins (Gemini free tier, then Workers AI as backup).
# Free Gemini quotas are per model and per day (Flash: 20/day), so two Gemini models go first.
PROVIDER = "gemini:gemini-flash-latest,gemini:gemini-flash-lite-latest,workers-ai"
GEMINI_MODEL = "gemini-flash-latest"
MODEL = "@cf/qwen/qwen3.8-27b"  # best of the free-plan models tested 2026-09-29 (Gemma 4, Llama 3.3 70B, Qwen)
DAILY_LIMIT = "200"
IP_DAILY_LIMIT = "50"
# "off" = the AI works without the access code (shared with family since 2026-10-02).
# Set it back to "on" before moving to a paid provider (mygarden-backlog#5).
REQUIRE_CODE = "off"
# THINKING = "on" turns on the model's reasoning; in tests it was slower and no better.

# Secret, set once with `npx wrangler secret put ACCESS_CODE` (local dev: .dev.vars).
